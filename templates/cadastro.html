<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar usuário</title>

    <style>

        body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e6e6e6, #f5f5f5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container{
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        label{
            font-weight: bold;
            font-size: 14px;
        }

        input, select{
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover{
            background: #1e7e34;
        }

        .erro{
            background: #fdecea;
            color: #b71c1c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #dc3545;
            font-size: 14px;
        }

        .voltar{
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }

        .voltar:hover{
            color: #000;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Cadastro</h1>

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

    <form action="/Cadastro" method="post">

        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>Email</label>
        <input type="text" name="email" required>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <label>Confirmar senha</label>
        <input type="password" name="confirmarSenha" required>

        <label>Tipo de usuário</label>
        <select name="tipoUsuario">
            <option value="leitor">Leitor</option>
            <option value="escritor">Escritor</option>
        </select>

        <button type="submit">Criar conta</button>

    </form>

    <a class="voltar" href="{{ url_for('home') }}">
        ← Voltar
    </a>

</div>

</body>
</html>
