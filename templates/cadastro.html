<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar usuário</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            color: #111;
        }

        .container{
            width: 350px;
        }

        h1{
            text-align: center;
            margin-bottom: 30px;

            color: #111;
            font-size: 32px;
            font-weight: 600;
        }

        label{
            display: block;
            margin-bottom: 6px;

            color: #333;
            font-size: 14px;
        }

        input,
        select{
            width: 100%;

            padding: 13px;
            margin-bottom: 16px;

            border: 1px solid #d4d4d4;
            border-radius: 8px;

            background: #fff;
            color: #111;

            font-size: 14px;

            transition: 0.2s;
        }

        input:focus,
        select:focus{
            outline: none;
            border-color: #7c3aed;
        }

        button{
            width: 100%;

            padding: 13px;

            border: none;
            border-radius: 8px;

            background: #7c3aed;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover{
            background: #6d28d9;
        }

        .erro{
            background: #fdecea;
            border: 1px solid #dc3545;

            color: #b71c1c;

            padding: 12px;
            margin-bottom: 18px;

            border-radius: 8px;

            font-size: 14px;
        }

        .voltar{
            display: block;

            margin-top: 18px;

            text-align: center;
            text-decoration: none;

            color: #555;
            font-size: 14px;
        }

        .voltar:hover{
            color: #000;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Cadastro</h1>

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

    <form action="/Cadastro" method="post">

        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>Email</label>
        <input type="text" name="email" required>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <label>Confirmar senha</label>
        <input type="password" name="confirmarSenha" required>

        <label>Tipo de usuário</label>

        <select name="tipoUsuario">
            <option value="leitor">Leitor</option>
            <option value="escritor">Escritor</option>
        </select>

        <button type="submit">Criar conta</button>

    </form>

    <a class="voltar" href="{{ url_for('home') }}">
        ← Voltar
    </a>

</div>

</body>
</html>
