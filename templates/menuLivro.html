<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulos</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background-color:#f4f4f4;
            padding:40px;
        }

        .container{
            max-width:900px;
            margin:auto;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
            color:#222;
            font-size:42px;
        }

        .topo{
            display:flex;
            justify-content:flex-end;
            margin-bottom:30px;
        }

        .botaoAdicionar{
            text-decoration:none;
            background-color:#222;
            color:white;
            padding:14px 22px;
            border-radius:10px;
            font-size:18px;
            transition:0.3s;
        }

        .botaoAdicionar:hover{
            background-color:#444;
        }

        .capitulo{
            background-color:white;
            padding:25px;
            margin-bottom:20px;
            border-radius:15px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .titulo{
            font-size:24px;
            font-weight:bold;
            color:#222;
        }

        .acoes{
            display:flex;
            gap:15px;
        }

        .botao{
            text-decoration:none;
            background-color:#222;
            color:white;
            padding:10px 18px;
            border-radius:8px;
            transition:0.3s;
            font-size:16px;
        }

        .botao:hover{
            background-color:#444;
        }

        .vazio{
            text-align:center;
            font-size:22px;
            color:#666;
            margin-top:50px;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>Capítulos</h1>

        <div class="topo">

            <a 
                class="botaoAdicionar"
                href=""
            >
                + Adicionar Capítulo
            </a>

        </div>

        {% if capitulos %}

            {% for capitulo in capitulos %}

                <div class="capitulo">

                    <p class="titulo">
                        {{ capitulo.titulo }}
                    </p>

                    <div class="acoes">

                        <a 
                            class="botao"
                            href=""
                        >
                            Editar
                        </a> 

                        <a 
                            class="botao"
                            href=""
                        >
                            Ler
                        </a> 

                    </div>

                </div>

            {% endfor %}

        {% else %}

            <p class="vazio">
                Nenhum capítulo cadastrado.
            </p>

        {% endif %}

    </div>

</body>
</html>
