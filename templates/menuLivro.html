<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capítulos</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color:#f4f4f4;
            padding:40px;
        }

        .container{
            max-width:900px;
            margin:auto;
        }

        h1{
            text-align:center;
            font-size:42px;
            margin-bottom:10px;
            color:#222;
        }

        .livro{
            text-align:center;
            font-size:22px;
            color:#555;
            margin-bottom:40px;
        }

        .topo{
            display:flex;
            justify-content:flex-end;
            margin-bottom:25px;
        }

        .btn-add{
            text-decoration:none;
            background:#222;
            color:#fff;
            padding:12px 18px;
            border-radius:8px;
            transition:0.3s;
        }

        .btn-add:hover{
            background:#444;
        }

        .card{
            background:#fff;
            padding:20px;
            margin-bottom:15px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);

            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .titulo{
            font-size:20px;
            font-weight:bold;
            color:#222;
        }

        .acoes{
            display:flex;
            gap:10px;
        }

        .btn{
            text-decoration:none;
            background:#222;
            color:#fff;
            padding:8px 14px;
            border-radius:6px;
            transition:0.3s;
            font-size:14px;
        }

        .btn:hover{
            background:#444;
        }

        .vazio{
            text-align:center;
            font-size:20px;
            color:#666;
            margin-top:50px;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Capítulos</h1>

    <p class="livro">
        {{ livro.titulo }}
    </p>

    <div class="topo">
        <a class="btn-add"
           href="{{ url_for('addCapitulo', idLivro=livro.id) }}">
            + Adicionar Capítulo
        </a>
    </div>

    {% if capitulos %}

        {% for capitulo in capitulos %}

            <div class="card">

                <div class="titulo">
                    {{ capitulo.titulo }}
                </div>

                <div class="acoes">

                    <a class="btn"
                       href="{{ url_for('editarCapitulo', idCapitulo=capitulo.idCapitulo) }}">
                        Editar
                    </a>

                </div>

            </div>

        {% endfor %}

    {% else %}

        <p class="vazio">
            Nenhum capítulo cadastrado.
        </p>

    {% endif %}
    <a href="{{url_for('obras',)}}">Para voltar</a>

</div>

</body>
</html>
