<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container{
            width: 600px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
        }

        h1{
            text-align: center;
            margin-bottom: 25px;
            color: #111;
        }

        label{
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        input, textarea{
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 15px;

            border-radius: 8px;
            border: 1px solid #d4d4d4;

            background: #fff;
            color: #111;

            font-size: 14px;
        }

        textarea{
            min-height: 200px;
            resize: vertical;
        }

        input:focus,
        textarea:focus{
            outline: none;
            border-color: #7c3aed;
        }

        button{
            width: 100%;
            padding: 12px;

            background: #7c3aed;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover{
            background: #6d28d9;
        }

        .mensagem{
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .erro{
            background: #f5f5f5;
            color: #111;
            border: 1px solid #7c3aed;
        }

        .sucesso{
            background: #f5f5f5;
            color: #111;
            border: 1px solid #22c55e;
        }

        .voltar{
            display: block;
            text-align: center;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }

        .voltar:hover{
            color: #000;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Cadastrar Livro</h1>

    {% if erro %}
        <div class="mensagem erro">
            {{ erro }}
        </div>
    {% endif %}

    {% if sucesso %}
        <div class="mensagem sucesso">
            {{ sucesso }}
        </div>
    {% endif %}

    <form action="/cadastrarLivro" method="POST" enctype="multipart/form-data">

        <label>Título</label>
        <input type="text" name="titulo" required>

        <label>Autor</label>
        <input type="text" name="autor" required>

        <label>Descrição</label>
        <textarea name="descricao" required></textarea>

        <label>Quantidade de páginas</label>
        <input type="number" name="quantPag" required>

        <label>Capa do livro</label>
        <input type="file" name="imagem" accept=".png, .jpg, .jpeg" required>

        <button type="submit">Cadastrar</button>

    </form>

    <a class="voltar" href="{{ url_for('obras') }}">
        ← Suas obras
    </a>

</div>

</body>
</html>
