<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
</head>
<body>

    <h1>Cadastrar Livro</h1>
    {% if erro %}
        <p>{{ erro }}</p>
    {% endif %}
    {% if sucesso %}
        <p>{{ sucesso }}</p>
    {% endif %}
    <form 
        action="/cadastrarLivro" 
        method="POST" 
        enctype="multipart/form-data"
    >

        <label>Título:</label>
        <input 
            type="text" 
            name="titulo"
            required
        >

        <br><br>

        <label>Autor:</label>
        <input 
            type="text" 
            name="autor"
            required
        >

        <br><br>

        <label>Descrição:</label>
        <textarea 
            name="descricao"
            required
        ></textarea>

        <br><br>

        <label>Conteúdo:</label>
        <textarea 
            name="conteudo"
            rows="25"
            cols="100"
            required
        ></textarea>

        <br><br>

        <label>Quantidade de páginas:</label>
        <input 
            type="number" 
            name="quantPag"
            required
        >

        <br><br>

        <label>Imagem:</label>
        <input 
            type="file" 
            name="imagem"
            accept="image/*"
            required
        >

        <br><br>

        <button type="submit">
            Cadastrar
        </button>

    </form>

</body>
</html>
