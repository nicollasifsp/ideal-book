<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Capítulo</title>

    <!-- QUILL -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container{
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            margin-bottom: 20px;
        }

        /* QUILL */
        #editor{
            height: 400px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .voltar{
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #333;
        }

        .mensagem{
            max-width: 900px;
            margin: 15px auto;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
        }

        .sucesso{
            background-color: #e6f9ed;
            color: #1e7e34;
            border-left: 6px solid #28a745;
        }

        .erro{
            background-color: #fdecea;
            color: #b71c1c;
            border-left: 6px solid #dc3545;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

    </style>
</head>

<body>

{% if sucesso %}
    <div class="mensagem sucesso">{{ sucesso }}</div>
{% endif %}

{% if erro %}
    <div class="mensagem erro">{{ erro }}</div>
{% endif %}

<div class="container">

    <h1>Editar capítulo</h1>

    <!-- TÍTULO -->
    <label>Título</label>
    <input type="text"
           id="titulo"
           value="{{ capitulo.titulo }}">

    <!-- EDITOR -->
    <label>Conteúdo</label>
    <div id="editor"></div>

    <a class="voltar"
       href="{{ url_for('menuLivro', idLivro=capitulo.idLivro) }}">
        Voltar para a obra
    </a>

</div>

<!-- DADOS PRO JS -->
<script>
    window.idCapituloInicial = {{ capitulo.idCapitulo }};
    window.idLivro = {{ capitulo.idLivro }};
    window.conteudoInicial = `{{ capitulo.conteudo|safe }}`;
</script>

<!-- QUILL -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<!-- JS -->
<script src="{{ url_for('static', filename='js/quill.js') }}"></script>
<script src="{{ url_for('static', filename='js/autosave.js') }}"></script>

</body>
</html>
