<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar Capítulo</title>

    <style>

        body{
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container{
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1{
            margin-bottom: 20px;
        }

        .voltar{
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #333;
        }

        .mensagem{
            max-width: 900px;
            margin: 15px auto;
            padding: 15px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
        }

        .sucesso{
            background-color: #e6f9ed;
            color: #1e7e34;
            border-left: 6px solid #28a745;
        }

        .erro{
            background-color: #fdecea;
            color: #b71c1c;
            border-left: 6px solid #dc3545;
        }

        input,
        textarea{
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        textarea{
            min-height: 400px;
            resize: vertical;
            font-family: Arial, sans-serif;
        }

        button{
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

    </style>
</head>

<body>

{% if sucesso %}
    <div class="mensagem sucesso">{{ sucesso }}</div>
{% endif %}

{% if erro %}
    <div class="mensagem erro">{{ erro }}</div>
{% endif %}

<div class="container">

    <h1>Editar capítulo</h1>

    <form method="POST">

        <label>Título</label>
        <input
            type="text"
            name="titulo"
            value="{{ capitulo.titulo }}"
            required
        >

        <label>Conteúdo</label>
        <textarea
            name="conteudo"
            required
        >{{ capitulo.conteudo }}</textarea>

        <button type="submit">Salvar Alterações</button>

    </form>

    <a
        class="voltar"
        href="{{ url_for('menuLivro', idLivro=capitulo.idLivro) }}"
    >
        Voltar para a obra
    </a>

</div>

</body>
</html>
