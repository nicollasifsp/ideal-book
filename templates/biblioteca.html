<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f5;
            padding: 40px;
            color: #111;
        }

        .pai{
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            justify-content: center;
        }

        .filha{
            width: 320px;
            background: white;

            border: 1px solid #e5e5e5;
            border-radius: 12px;

            overflow: hidden;
            transition: 0.2s;
        }

        .filha:hover{
            border-color: #7c3aed;
        }

        .filha img{
            width: 100%;
            height: 420px;
            object-fit: cover;
        }

        .titulo{
            font-size: 22px;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }

        .descricao{
            margin-top: 12px;
            font-size: 15px;
            color: #555;
            text-align: justify;
            line-height: 1.6;
            padding: 0 15px;
        }

        .autor{
            margin-top: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        a{
            display: block;
            margin: 18px;
            text-align: center;

            text-decoration: none;

            background: #7c3aed;
            color: white;

            padding: 12px;
            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            transition: 0.2s;
        }

        a:hover{
            background: #6d28d9;
        }

    </style>

</head>
<body>

    <div class="pai">

        {% if livros %}

            {% for livro in livros %}

                <div class="filha">

                    <img src="{{ livro.caminhoImagem }}" alt="capa do livro">

                    <p class="titulo">
                        {{ livro.titulo }}
                    </p>

                    <p class="descricao">
                        {{ livro.descricao }}
                    </p>

                    <p class="autor">
                        {{ livro.autor }}
                    </p>

                    <a href="{{ url_for('lerLivro', id=livro.id) }}">
                        Ler livro
                    </a>

                </div>

            {% endfor %}

        {% endif %}

    </div>

</body>
</html>
