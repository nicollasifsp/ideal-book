<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f4f4;
        }

        .pai{
            display:flex;
            flex-wrap:wrap;
            gap:30px;
            justify-content:center;
        }

        .filha{
            width:350px;
            background-color:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.2);
        }

        .filha img{
            width:100%;
            height:500px;
            object-fit:cover;
            border-radius:10px;
        }

        .titulo{
            font-size:32px;
            font-weight:bold;
            margin-top:15px;
            text-align:center;
        }

        .descricao{
            margin-top:15px;
            font-size:18px;
            text-align:justify;
        }

        .autor{
            margin-top:20px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="pai">

        {% if livros %}

            {% for livro in livros %}

                <div class="filha">

                    <img 
                        src="{{ livro.caminhoImagem }}" 
                        alt="capa do livro"
                    >

                    <p class="titulo">
                        {{ livro.titulo }}
                    </p>

                    <p class="descricao">
                        {{ livro.descricao }}
                    </p>

                    <p class="autor">
                        {{ livro.autor }}
                    </p>

                </div>

            {% endfor %}

        {% endif %}

    </div>

</body>
</html>
