<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f5;
            padding: 40px;
            color: #111;
        }

        h1{
            text-align: center;
            margin-bottom: 40px;
            font-size: 40px;
            color: #111;
        }

        .pai{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .filha{
            width: 320px;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.2s;
        }

        .filha:hover{
            border-color: #7c3aed;
        }

        .filha img{
            width: 100%;
            height: 420px;
            object-fit: cover;
            background: #eee;
        }

        .conteudo{
            padding: 18px;
        }

        .titulo{
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            color: #111;
        }

        
        .descricao{
            margin-top: 12px;
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            text-align: justify;

            max-height: 70px;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .descricao.expandida{
            max-height: 1000px;
        }

        
        .btn-desc{
            margin-top: 10px;
            background: none;
            border: none;
            color: #7c3aed;
            font-size: 13px;
            cursor: pointer;

            display: none;
        }

        .btn-desc:hover{
            text-decoration: underline;
        }

        .autor{
            margin-top: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }

        .botao{
            display: block;
            width: 100%;
            margin-top: 18px;

            text-align: center;
            text-decoration: none;

            background: #7c3aed;
            color: white;

            padding: 12px;
            border-radius: 8px;

            font-size: 15px;
            font-weight: bold;

            transition: 0.2s;
        }

        .botao:hover{
            background: #6d28d9;
        }

        .vazio{
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-top: 40px;
        }

        .botao-atencao {
            background-color: #dc3545;
                color: white;
                padding: 10px 15px;
                border-radius: 6px;
                text-decoration: none;
                font-weight: bold;
                display: block;
                width: fit-content;
                margin: 20px auto; 
                transition: 0.2s;
        }

        .botao-atencao:hover {
            background-color: #bb2d3b;
        }

    </style>

</head>
<body>
    {% if erro %}
    <div class="alert-erro">{{ erro }}</div>
    {% endif %}

    {% if sucesso %}
    <div class="alert-sucesso">{{ sucesso }}</div>
    {% endif %}

    <h1>Livros</h1>

    <div class="pai">

        {% if livros %}

            {% for livro in livros %}

                <div class="filha">

                    <img src="{{ livro.caminhoImagem }}" alt="imagem do livro">

                    <div class="conteudo">

                        <p class="titulo">
                            {{ livro.titulo }}
                        </p>

                        <p class="descricao" id="desc-{{ livro.id }}">
                            {{ livro.descricao }}
                        </p>

                        <button class="btn-desc" id="btn-{{ livro.id }}"
                                onclick="toggleDesc('{{ livro.id }}')">
                            Mostrar mais
                        </button>

                        <p class="autor">
                            {{ livro.autor }}
                        </p>

                        <a class="botao" href="{{url_for('menuLivro',idLivro=livro.id)}}">
                            Detalhar livro
                        </a>
                        <a class="botao-atencao" href="{{url_for('menuLivro',idLivro=livro.id)}}">
                            Deletar livro
                        </a>

                    </div>

                </div>

            {% endfor %}

        {% else %}

            <p class="vazio">
                Nenhum livro cadastrado.
            </p>

        {% endif %}

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const descricoes = document.querySelectorAll(".descricao");

            descricoes.forEach(desc => {
                const btn = desc.nextElementSibling;

                if (desc.scrollHeight > desc.clientHeight) {
                    btn.style.display = "block";
                }
            });
        });

        function toggleDesc(id){
            const desc = document.getElementById("desc-" + id);
            const btn = document.getElementById("btn-" + id);

            desc.classList.toggle("expandida");

            if(desc.classList.contains("expandida")){
                btn.innerText = "Mostrar menos";
            } else {
                btn.innerText = "Mostrar mais";
            }
        }
    </script>

</body>
</html>
