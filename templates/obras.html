<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livros</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background-color:#f4f4f4;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
            font-size:42px;
            color:#333;
        }

        .pai{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:30px;
        }

        .filha{
            width:350px;
            background-color:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0px 0px 15px rgba(0,0,0,0.15);
            transition:0.3s;
        }

        .filha:hover{
            transform:translateY(-5px);
        }

        .filha img{
            width:100%;
            height:450px;
            object-fit:cover;
        }

        .conteudo{
            padding:20px;
        }

        .titulo{
            font-size:28px;
            font-weight:bold;
            text-align:center;
            color:#222;
        }

        .descricao{
            margin-top:15px;
            font-size:17px;
            color:#555;
            text-align:justify;
            line-height:1.5;
        }

        .autor{
            margin-top:20px;
            text-align:center;
            font-size:20px;
            font-weight:bold;
            color:#111;
        }

        .botao{
            display:block;
            width:100%;
            margin-top:25px;
            text-align:center;
            text-decoration:none;
            background-color:#222;
            color:white;
            padding:14px;
            border-radius:8px;
            font-size:18px;
            transition:0.3s;
        }

        .botao:hover{
            background-color:#444;
        }

        .vazio{
            text-align:center;
            font-size:22px;
            color:#666;
            margin-top:40px;
        }

    </style>

</head>
<body>

    <h1>Livros</h1>

    <div class="pai">

        {% if livros %}

            {% for livro in livros %}

                <div class="filha">

                    <img 
                        src="{{ livro.caminhoImagem }}" 
                        alt="imagem do livro"
                    >

                    <div class="conteudo">

                        <p class="titulo">
                            {{ livro.titulo }}
                        </p>

                        <p class="descricao">
                            {{ livro.descricao }}
                        </p>

                        <p class="autor">
                            {{ livro.autor }}
                        </p>

                    </div>

                </div>

            {% endfor %}

        {% else %}

            <p class="vazio">
                Nenhum livro cadastrado.
            </p>

        {% endif %}

    </div>

</body>
</html>
