<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f5;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            width: 340px;
        }

        h1{
            color: #111;
            text-align: center;
            margin-bottom: 30px;
            font-size: 34px;
            font-weight: 600;
        }

        label{
            color: #333;
            font-size: 14px;
            display: block;
            margin-bottom: 6px;
        }

        input{
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;

            border: 1px solid #d4d4d4;
            border-radius: 8px;

            background: #ffffff;
            color: #111;

            font-size: 15px;

            transition: 0.2s;
        }

        input:focus{
            outline: none;
            border-color: #7c3aed;
        }

        button{
            width: 100%;
            padding: 14px;

            border: none;
            border-radius: 8px;

            background: #7c3aed;
            color: white;

            font-size: 15px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover{
            background: #6d28d9;
        }

        .erro{
            background: #fdecea;
            border: 1px solid #dc3545;

            color: #b71c1c;

            padding: 12px;
            margin-bottom: 18px;

            border-radius: 8px;

            font-size: 14px;
        }

        .voltar{
            display: block;
            text-align: center;

            margin-top: 18px;

            color: #555;
            text-decoration: none;
            font-size: 14px;

            transition: 0.2s;
        }

        .voltar:hover{
            color: #000;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Login</h1>

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

    <form action="/Login" method="post">

        <label>Email</label>
        <input type="text" name="email" required>

        <label>Senha</label>
        <input type="password" name="senha" required>

        <button type="submit">Entrar</button>

    </form>

    <a class="voltar" href="{{ url_for('home') }}">
        ← Voltar
    </a>

</div>

</body>
</html>
