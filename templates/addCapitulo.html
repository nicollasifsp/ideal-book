<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if capitulo %}
            Editar Capítulo
        {% else %}
            Criar Capítulo
        {% endif %}
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            padding:40px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            font-size:36px;
            color:#222;
        }

        .campo{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        input, textarea{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#eee;
            font-size:16px;
        }

        textarea{
            height:400px;
            resize:vertical;
            line-height:1.6;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#222;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#444;
        }

        .mensagem{
            background:#d4edda;
            color:#155724;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        .erro{
            background:#f8d7da;
            color:#721c24;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        .voltar{
            display:block;
            margin-top:20px;
            text-align:center;
            text-decoration:none;
            color:#333;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>
        {% if capitulo %}
            Editar Capítulo
        {% else %}
            Criar Capítulo
        {% endif %}
    </h1>

    {% if sucesso %}
        <p class="mensagem">{{ sucesso }}</p>
    {% endif %}

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form method="POST" autocomplete="off"
          action="{{ url_for('addCapitulo', idLivro=livro.id) }}">

        <div class="campo">
            <label>Título</label>
            <input type="text" name="titulo"
                   value="{{ capitulo.titulo if capitulo else '' }}"
                   required>
        </div>

        <div class="campo">
            <label>Conteúdo</label>
            <textarea name="conteudo" required>
{{ capitulo.conteudo if capitulo else '' }}</textarea>
        </div>

        <button type="submit">
            {% if capitulo %}
                Salvar Alterações
            {% else %}
                Criar Capítulo
            {% endif %}
        </button>

    </form>

    <a class="voltar"
       href="{{ url_for('menuLivro', idLivro=livro.id) }}">
        Voltar para a obra
    </a>

</div>

</body>
</html>
