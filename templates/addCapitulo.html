<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f5;
            padding:40px;
            color:#111;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:14px;
            border:1px solid #e5e5e5;
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            font-size:34px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            font-size:14px;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            border:1px solid #d4d4d4;
            border-radius:10px;
            font-size:16px;
            margin-bottom:20px;
        }

        textarea{
            min-height:450px;
            resize:vertical;
            font-family:Arial, Helvetica, sans-serif;
        }

        .mensagem{
            background:#f0fdf4;
            border:1px solid #22c55e;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        .erro{
            background:#fef2f2;
            border:1px solid #ef4444;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        button{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#7c3aed;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }

        .voltar{
            display:block;
            margin-top:20px;
            text-align:center;
            text-decoration:none;
            color:#555;
        }
    </style>
</head>
<body>

<div class="container">


    {% if sucesso %}
        <p class="mensagem">{{ sucesso }}</p>
    {% endif %}

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form action="{{url_for('addCapitulo',idLivro=livro.id)}}" method="POST">

        <label for="titulo">Título</label>
        <input
            type="text"
            id="titulo"
            name="titulo"
            required
        >

        <label for="conteudo">Conteúdo</label>
        <textarea
            id="conteudo"
            name="conteudo"
            required
        ></textarea>

        <button type="submit">Salvar</button>

    </form>

    <a
        class="voltar"
        href="{{ url_for('menuLivro', idLivro=livro.id) }}"
    >
        Voltar para a obra
    </a>

</div>

</body>
</html>
