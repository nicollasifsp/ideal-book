<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% if capitulo %}
            Editar Capítulo
        {% else %}
            Criar Capítulo
        {% endif %}
    </title>

    <!-- QUILL -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

    <style>
        /* SEU CSS MANTIDO (sem mudanças importantes) */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f5;
            padding:40px;
            color:#111;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:14px;
            border:1px solid #e5e5e5;
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            font-size:34px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            font-size:14px;
        }

        #editor{
            height:450px;
            border:1px solid #d4d4d4;
            border-radius:10px;
        }

        .mensagem{
            background:#f0fdf4;
            border:1px solid #22c55e;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        .erro{
            background:#fef2f2;
            border:1px solid #ef4444;
            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        .voltar{
            display:block;
            margin-top:20px;
            text-align:center;
            text-decoration:none;
            color:#555;
        }

        .voltar:hover{
            color:#000;
        }

        button{
            width:100%;
            margin-top:20px;
            padding:15px;
            border:none;
            border-radius:10px;
            background:#7c3aed;
            color:white;
            font-weight:bold;
            cursor:pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>
        {% if capitulo %}
            Editar Capítulo
        {% else %}
            Criar Capítulo
        {% endif %}
    </h1>

    {% if sucesso %}
        <p class="mensagem">{{ sucesso }}</p>
    {% endif %}

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <!-- INPUT TÍTULO (IMPORTANTE) -->
    <label>Título</label>
    <input type="text"
           id="titulo"
           value="{{ capitulo.titulo if capitulo else '' }}">

    <br><br>

    <!-- EDITOR QUILL -->
    <label>Conteúdo</label>
    <div id="editor"></div>

    <button onclick="manualSave()">Salvar agora</button>

    <a class="voltar"
       href="{{ url_for('menuLivro', idLivro=livro.id) }}">
        Voltar para a obra
    </a>

</div>

<!-- PASSANDO DADOS PARA JS -->
<script>
    window.idCapituloInicial = {{ capitulo.idCapitulo if capitulo else 'null' }};
    window.idLivro = {{ livro.id }};
    window.tituloInicial = "{{ capitulo.titulo if capitulo else '' }}";
    window.conteudoInicial = `{{ capitulo.conteudo|safe if capitulo else '' }}`;
</script>

<!-- QUILL -->
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<!-- SEUS SCRIPTS -->
<script src="{{ url_for('static', filename='js/quill.js') }}"></script>
<script src="{{ url_for('static', filename='js/autosave.js') }}"></script>

</body>
</html>
