<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if capitulo %}
            Editar Capítulo
        {% else %}
            Criar Capítulo
        {% endif %}
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background-color:#f4f4f4;
            font-family:Arial, Helvetica, sans-serif;
            padding:40px;
        }

        .container{
            max-width:900px;
            margin:auto;
            background-color:white;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            color:#222;
            font-size:38px;
        }

        .mensagem{
            background-color:#d4edda;
            color:#155724;
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
            text-align:center;
        }

        .erro{
            background-color:#f8d7da;
            color:#721c24;
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
            text-align:center;
        }

        .campo{
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-bottom:10px;
            font-size:18px;
            font-weight:bold;
            color:#333;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            background-color:#eee;
            font-size:16px;
        }

        textarea{
            width:100%;
            height:500px;
            resize:none;
            border:none;
            border-radius:10px;
            background-color:#eee;
            padding:20px;
            font-size:17px;
            line-height:1.6;
        }

        button{
            width:100%;
            padding:16px;
            border:none;
            border-radius:10px;
            background-color:#222;
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background-color:#444;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>
            {% if capitulo %}
                Editar Capítulo
            {% else %}
                Novo Capítulo
            {% endif %}
        </h1>

        {% if mensagem %}
            <p class="mensagem">{{ mensagem }}</p>
        {% endif %}

        {% if erro %}
            <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST" autocomplete="off">

            <div class="campo">

                <label>Título</label>

                <input 
                    type="text"
                    name="titulo"
                    required
                    {% if capitulo %}
                        value="{{ capitulo.titulo }}"
                    {% endif %}
                >

            </div>

            <div class="campo">

                <label>Conteúdo</label>

                <textarea 
                    name="conteudo"
                    required
                >{% if capitulo %}{{ capitulo.conteudo }}{% endif %}</textarea>

            </div>

            <button>
                {% if capitulo %}
                    Salvar Alterações
                {% else %}
                    Criar Capítulo
                {% endif %}
            </button>

        </form>

    </div>

</body>
</html>
