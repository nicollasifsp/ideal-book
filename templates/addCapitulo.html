<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if capitulo %}
            Editar Capítulo
        {% else %}
            Criar Capítulo
        {% endif %}
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f5;
            padding:40px;
            color:#111;
        }

        .container{
            max-width:900px;
            margin:auto;
            background:white;

            padding:40px;
            border-radius:14px;
            border:1px solid #e5e5e5;
        }

        h1{
            text-align:center;
            margin-bottom:25px;
            font-size:34px;
            color:#111;
        }

        .campo{
            margin-bottom:20px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
            font-size:14px;
        }

        input, textarea{
            width:100%;
            padding:14px;

            border:1px solid #d4d4d4;
            border-radius:10px;

            background:#fff;
            font-size:16px;
            color:#111;

            transition:0.2s;
        }

        textarea{
            height:420px;
            resize:vertical;
            line-height:1.8;
        }

        input:focus,
        textarea:focus{
            outline:none;
            border-color:#7c3aed;
        }

        button{
            width:100%;
            padding:15px;

            border:none;
            border-radius:10px;

            background:#7c3aed;
            color:white;

            font-size:17px;
            font-weight:bold;

            cursor:pointer;
            transition:0.2s;
        }

        button:hover{
            background:#6d28d9;
        }

        .mensagem{
            background:#f4f4f5;
            border:1px solid #22c55e;

            color:#111;

            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        .erro{
            background:#f4f4f5;
            border:1px solid #7c3aed;

            color:#111;

            padding:15px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
        }

        .voltar{
            display:block;
            margin-top:20px;

            text-align:center;
            text-decoration:none;

            color:#555;
            font-size:14px;
        }

        .voltar:hover{
            color:#000;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>
        {% if capitulo %}
            Editar Capítulo
        {% else %}
            Criar Capítulo
        {% endif %}
    </h1>

    {% if sucesso %}
        <p class="mensagem">{{ sucesso }}</p>
    {% endif %}

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form method="POST" autocomplete="off"
          action="{{ url_for('addCapitulo', idLivro=livro.id) }}">

        <div class="campo">
            <label>Título</label>
            <input type="text" name="titulo"
                   value="{{ capitulo.titulo if capitulo else '' }}"
                   required>
        </div>

        <div class="campo">
            <label>Conteúdo</label>
            <textarea name="conteudo" required>{{ capitulo.conteudo if capitulo else '' }}</textarea>
        </div>

        <button type="submit">
            {% if capitulo %}
                Salvar Alterações
            {% else %}
                Criar Capítulo
            {% endif %}
        </button>

    </form>

    <a class="voltar"
       href="{{ url_for('menuLivro', idLivro=livro.id) }}">
        Voltar para a obra
    </a>

</div>

</body>
</html>
