<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ capitulo.titulo }}</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Georgia, "Times New Roman", serif;
            background: #f2f2f2;
            color: #1f1f1f;
            line-height: 1.9;
        }

        .container{
            max-width: 780px;
            margin: 60px auto;
            padding: 60px 55px;

            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 10px;

            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }

        h1{
            font-size: 38px;
            margin-bottom: 30px;
            color: #111;
            line-height: 1.3;
        }

        .conteudo{
            font-size: 22px; /* aumentei aqui */
            line-height: 2.1;
            color: #2a2a2a;

            white-space: pre-line;
            text-align: justify;
            letter-spacing: 0.2px;
        }

        .voltar{
            display: inline-block;
            margin-top: 40px;

            text-decoration: none;
            color: #7c3aed;
            font-size: 16px;
            font-weight: bold;
        }

        .voltar:hover{
            color: #5b21b6;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>{{ capitulo.titulo }}</h1>

    <div class="conteudo">
        {{ capitulo.conteudo }}
    </div>

    <a class="voltar" href="{{ url_for('lerLivro', id=capitulo.idLivro) }}">
        ← Voltar para o livro
    </a>

</div>

</body>
</html>
