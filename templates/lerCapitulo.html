<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ capitulo.titulo }}</title>

    <style>

        body {
            font-family: Georgia, "Times New Roman", serif;
            background: #f2f2f2;
            margin: 0;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 25px;
            color: #222;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .conteudo {
            font-size: 20px;
            line-height: 1.9;
            color: #333;
            white-space: pre-line;
        }

        /* BOTÃO VOLTAR */
        .voltar {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            background: #007bff;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.2s;
        }

        .voltar:hover {
            background: #0056b3;
            transform: scale(1.03);
        }

        /* EFEITO DE LEITURA */
        .container:hover {
            box-shadow: 0 10px 25px rgba(0,0,0,0.12);
        }

    </style>
</head>

<body>

<div class="container">

    <h1>{{ capitulo.titulo }}</h1>

    <div class="conteudo">
        {{ capitulo.conteudo }}
    </div>

    <a class="voltar" href="{{ url_for('lerLivro', id=capitulo.idLivro) }}">
        ← Voltar para o livro
    </a>

</div>

</body>
</html>
