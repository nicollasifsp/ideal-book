<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ livro.titulo }}</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            margin:40px;
            background-color:#f4f4f4;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
        }

        img{
            width:300px;
            border-radius:10px;
        }

        .titulo{
            font-size:40px;
            font-weight:bold;
            margin-top:20px;
        }

        .autor{
            font-size:22px;
            margin-top:10px;
        }

        .conteudo{
            margin-top:30px;
            font-size:20px;
            line-height:1.8;
            white-space:pre-wrap;
        }

    </style>

</head>
<body>

    <div class="container">

        <p class="titulo">
            {{ livro.titulo }}
        </p>

        <div class="conteudo">
            {{ livro.conteudo }}
        </div>

    </div>

</body>
</html>
