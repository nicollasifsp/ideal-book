<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ livro.titulo }}</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            margin:40px;
            background-color:#f4f4f4;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:10px;
        }

        img{
            width:300px;
            border-radius:10px;
        }

        .titulo{
            font-size:40px;
            font-weight:bold;
            margin-top:20px;
        }

        .autor{
            font-size:22px;
            margin-top:10px;
        }

        .conteudo{
            margin-top:30px;
            font-size:20px;
            line-height:1.8;
            white-space:pre-wrap;
        }

    </style>

</head>
<body>

    <div class="container">
        <h1>{{livro.titulo}}</h1>
        {% for capitulo in capitulos %}
            <h2>{{capitulo.titulo}}</h2>
            <a href="{{ url_for('lerCapitulo', idCapitulo=capitulo.id) }}">Ler</a>
        {% endfor %} 
        
    </div>

</body>
</html>
