<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página inicial</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background: whitesmoke;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container{
            text-align: center;
            padding: 20px;
        }

        h1{
            color: black;
            font-size: 40px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .botoes{
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        a{
            text-decoration: none;
            padding: 12px 22px;

            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;

            transition: 0.2s ease;
        }

        /* botão principal */
        .login{
            background: #8b5cf6;
            color: white;
            border: 1px solid transparent;
        }

        .login:hover{
            background: #7c3aed;
            transform: translateY(-1px);
        }

        /* botão secundário */
        .cadastro{
            background: #27272a;
            border: 1px solid #3f3f46;
            color: #d4d4d8;
        }

        .cadastro:hover{
            border-color: #8b5cf6;
            color: #f4f4f5;
            transform: translateY(-1px);
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>Bem-vindo</h1>

        <div class="botoes">

            <a class="login" href="{{ url_for('renderLogin') }}">
                Login
            </a>

            <a class="cadastro" href="{{ url_for('renderCadastro') }}">
                Novo usuário
            </a>

        </div>

    </div>

</body>
</html>
